<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>求职命运之书 · Career Destiny</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<canvas id="starCanvas"></canvas>

<!-- Top Navigation -->
<nav class="top-nav">
  <button class="nav-tab active" data-zone="zone1">
    职业罗盘<span class="badge"></span>
  </button>
  <button class="nav-tab" data-zone="zone2">
    成长地图<span class="badge"></span>
  </button>
  <button class="nav-tab" data-zone="zone3">
    成长仪表盘<span class="badge"></span>
  </button>
  <button class="nav-tab" data-zone="zone4">
    面试军械库<span class="badge"></span>
  </button>
</nav>

<!-- Zone 1: Career Compass -->
<div class="main-wrap">
  <div class="zone-container active" id="zone1"></div>
  <div class="zone-container" id="zone2"></div>
  <div class="zone-container" id="zone3"></div>
  <div class="zone-container" id="zone4"></div>
</div>

<!-- Footer reset -->
<div style="position:fixed;bottom:12px;right:20px;z-index:100;">
  <button id="hardResetBtn" style="
    background:transparent;border:1px solid rgba(200,138,126,0.3);border-radius:2px;
    color:#8a7060;font-family:inherit;font-size:0.7rem;letter-spacing:0.08em;
    padding:5px 14px;cursor:pointer;transition:all 0.3s ease;
  " onmouseover="this.style.borderColor='rgba(200,138,126,0.8)';this.style.color='#c88a7e';"
     onmouseout="this.style.borderColor='rgba(200,138,126,0.3)';this.style.color='#8a7060';"
     onclick="if(confirm('确定要清除所有数据并重新开始吗？')){localStorage.clear();location.reload();}">
    ↺ 清除全部数据
  </button>
</div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/zone4.js?v=2"></script>
</body>
</html>
